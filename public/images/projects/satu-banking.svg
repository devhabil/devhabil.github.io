  <text x="710" y="548" font-size="11" fill="#71717a">PAYMENT</text>
  <text x="880" y="548" font-family="Consolas, monospace" font-size="12" fill="#e4e4e7">- Rp 1,150,000</text>
  <rect x="1010" y="534" width="78" height="20" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35"/>
  <text x="1049" y="548" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">SETTLED</text>
