  <text x="1049" y="472" text-anchor="middle" font-size="10" font-weight="700" fill="#fbbf24">PENDING</text>

  <!-- Row 4 -->
  <text x="590" y="510" font-family="Consolas, monospace" font-size="12" fill="#a1a1aa">TXN-98226</text>
  <text x="710" y="510" font-size="11" fill="#71717a">DEPOSIT</text>
  <text x="880" y="510" font-family="Consolas, monospace" font-size="12" fill="#34d399">+ Rp 8,750,000</text>
  <rect x="1010" y="496" width="78" height="20" rx="10" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.35"/>
  <text x="1049" y="510" text-anchor="middle" font-size="10" font-weight="700" fill="#34d399">SETTLED</text>

