    <rect x="338" y="460" width="34" height="100" rx="4" fill="none" stroke="#10b981" stroke-dasharray="3 4"/>
  </g>

  <!-- Donut card -->
  <rect x="860" y="300" width="280" height="300" rx="10" fill="#141417" stroke="#27272a"/>
  <rect x="880" y="320" width="100" height="8" rx="4" fill="#3f3f46"/>
  <g transform="translate(0,0)">
    <circle cx="1000" cy="410" r="44" fill="none" stroke="#27272a" stroke-width="12"/>
    <circle cx="1000" cy="410" r="44" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="199 77.5" transform="rotate(-90 1000 410)"/>
    <text x="1000" y="416" text-anchor="middle" font-size="16" font-weight="700" fill="#fafafa">72%</text>
  </g>
  <text x="1000" y="478" text-anchor="middle" font-size="12" fill="#71717a">Present today</text>
  <g>
    <circle cx="884" cy="506" r="5" fill="#10b981"/><rect x="898" y="502" width="150" height="8" rx="4" fill="#27272a"/>
    <circle cx="884" cy="534" r="5" fill="#fbbf24"/><rect x="898" y="530" width="120" height="8" rx="4" fill="#27272a"/>
    <circle cx="884" cy="562" r="5" fill="#52525b"/><rect x="898" y="558" width="136" height="8" rx="4" fill="#27272a"/>
  </g>
