<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <!-- Backdrop -->
  <rect width="1200" height="675" fill="#09090b"/>

  <!-- Window -->
  <rect x="40" y="36" width="1120" height="604" rx="14" fill="#101013" stroke="#27272a" stroke-width="1.5"/>
  <rect x="40" y="36" width="1120" height="48" rx="14" fill="#141417"/>
  <rect x="40" y="60" width="1120" height="24" fill="#141417"/>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#27272a" stroke-width="1"/>
