  <rect x="260" y="320" width="120" height="8" rx="4" fill="#3f3f46"/>
  <circle cx="704" cy="324" r="5" fill="#10b981"/>
  <rect x="716" y="320" width="56" height="8" rx="4" fill="#3f3f46"/>
  <g stroke="#232327" stroke-width="1">
