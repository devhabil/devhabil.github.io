  <g>
    <rect x="240" y="180" width="280" height="100" rx="10" fill="#141417" stroke="#27272a"/>
    <rect x="260" y="198" width="90" height="8" rx="4" fill="#3f3f46"/>
    <text x="260" y="244" font-size="24" font-weight="700" fill="#fafafa">2,481</text>
    <text x="260" y="264" font-size="11" fill="#34d399">+12.4% vs last month</text>
  </g>
  <g>
    <rect x="550" y="180" width="280" height="100" rx="10" fill="#141417" stroke="#27272a"/>
    <rect x="570" y="198" width="90" height="8" rx="4" fill="#3f3f46"/>
    <text x="570" y="244" font-size="24" font-weight="700" fill="#fafafa">97.2%</text>
    <text x="570" y="264" font-size="11" fill="#34d399">+0.8% attendance rate</text>
  </g>
  <g>
