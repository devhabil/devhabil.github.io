  <rect x="56" y="204" width="14" height="14" rx="4" fill="#27272a"/><rect x="80" y="207" width="96" height="8" rx="4" fill="#27272a"/>
  <rect x="56" y="248" width="14" height="14" rx="4" fill="#27272a"/><rect x="80" y="251" width="88" height="8" rx="4" fill="#27272a"/>
  <rect x="56" y="292" width="14" height="14" rx="4" fill="#27272a"/><rect x="80" y="295" width="100" height="8" rx="4" fill="#27272a"/>
  <rect x="56" y="336" width="14" height="14" rx="4" fill="#27272a"/><rect x="80" y="339" width="80" height="8" rx="4" fill="#27272a"/>
  <rect x="56" y="380" width="14" height="14" rx="4" fill="#27272a"/><rect x="80" y="383" width="92" height="8" rx="4" fill="#27272a"/>

