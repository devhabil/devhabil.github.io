    <line x1="260" y1="512" x2="820" y2="512"/>
    <line x1="260" y1="464" x2="820" y2="464"/>
    <line x1="260" y1="416" x2="820" y2="416"/>
    <line x1="260" y1="368" x2="820" y2="368"/>
  </g>
  <g fill="#10b981">
    <rect x="270" y="490" width="34" height="70" rx="4"/>
    <rect x="338" y="460" width="34" height="100" rx="4"/>
    <rect x="406" y="475" width="34" height="85" rx="4"/>
    <rect x="474" y="430" width="34" height="130" rx="4"/>
    <rect x="542" y="400" width="34" height="160" rx="4"/>
    <rect x="610" y="420" width="34" height="140" rx="4"/>
    <rect x="678" y="370" width="34" height="190" rx="4"/>
    <rect x="746" y="330" width="34" height="230" rx="4"/>
  </g>
  <g fill="#10b981" opacity="0.35">
